<!DOCTYPE html>
<html>
<head>
    <title>Customer Segmentation</title>
    <style>
        :root {
            --bg: #0b1220;
            --panel: #111827;
            --panel-soft: rgba(255,255,255,0.06);
            --text: #e5e7eb;
            --muted: #94a3b8;
            --accent: #60a5fa;
            --accent-2: #38bdf8;
            --button: #2563eb;
            --button-hover: #1d4ed8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            background: radial-gradient(circle at top left, rgba(56, 189, 248, 0.15), transparent 30%),
                        linear-gradient(180deg, #0b1220 0%, #0f172a 100%);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .container {
            width: min(640px, 100%);
            background: rgba(17, 24, 39, 0.95);
            border: 1px solid rgba(148, 163, 184, 0.12);
            border-radius: 32px;
            padding: 32px;
            box-shadow: 0 25px 80px rgba(15, 23, 42, 0.35);
        }

        .hero {
            margin-bottom: 30px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 32px;
        }

        p {
            margin: 0;
            color: var(--muted);
            line-height: 1.6;
        }

        form {
            margin-top: 30px;
            display: grid;
            gap: 18px;
        }

        input {
            width: 100%;
            padding: 16px 18px;
            border-radius: 16px;
            border: 1px solid rgba(148, 163, 184, 0.18);
            background: rgba(255,255,255,0.04);
            color: var(--text);
            font-size: 16px;
        }

        input::placeholder {
            color: rgba(226, 232, 240, 0.65);
        }

        .buttons {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }

        button,
        .dashboard-link {
            flex: 1;
            min-width: 160px;
            padding: 14px 20px;
            border-radius: 16px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
        }

        button {
            background: var(--button);
            color: white;
            transition: background 0.2s ease;
        }

        button:hover {
            background: var(--button-hover);
        }

        .dashboard-link {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            background: rgba(56, 189, 248, 0.12);
            color: var(--accent);
            text-decoration: none;
            border: 1px solid rgba(56, 189, 248, 0.24);
        }

        .result {
            margin-top: 24px;
            padding: 18px 20px;
            border-radius: 18px;
            background: rgba(34, 197, 94, 0.12);
            color: #d1fae5;
            font-size: 18px;
            border: 1px solid rgba(34, 197, 94, 0.24);
        }
    </style>
</head>
<body>
<div class="container">
    <div class="hero">
        <div class="hero-header" style="display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:18px;">
            <div>
                <h1>Customer Segmentation System</h1>
                <p>Use your trained clustering model to predict customer segments and explore insights in the dashboard.</p>
            </div>
            {% if user %}
                <a href="/logout" class="dashboard-link" style="padding: 12px 18px; min-width: auto;">Logout</a>
            {% endif %}
        </div>
    </div>

    <form action="/predict" method="post">
        <input type="number" name="income" placeholder="Annual Income (k$)" required>
        <input type="number" name="score" placeholder="Spending Score (1-100)" required>
        <div class="buttons">
            <button type="submit">Predict Segment</button>
            <a class="dashboard-link" href="/dashboard">View Dashboard →</a>
        </div>
    </form>

    {% if prediction %}
        <div class="result">
            Predicted Segment: <strong>{{ prediction }}</strong>
        </div>
    {% endif %}
</div>
</body>
</html>
