<!DOCTYPE html>
<html>
<head>
    <title>Create Account - Customer Segmentation</title>
    <style>
        :root {
            --bg: #0b1220;
            --panel: #111827;
            --text: #e5e7eb;
            --muted: #94a3b8;
            --accent: #60a5fa;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #090d1f 0%, #111827 55%, #0f172a 100%);
            color: var(--text);
            font-family: 'Segoe UI', sans-serif;
            padding: 24px;
        }

        .container {
            width: min(520px, 100%);
            background: rgba(17, 24, 39, 0.95);
            border: 1px solid rgba(148, 163, 184, 0.12);
            border-radius: 28px;
            padding: 36px;
            box-shadow: 0 30px 70px rgba(15, 23, 42, 0.35);
        }

        h1 { margin: 0 0 10px; font-size: 32px; }
        p { margin: 0 0 24px; color: var(--muted); line-height: 1.6; }

        .form-group { margin-bottom: 18px; }
        input {
            width: 100%;
            padding: 16px 18px;
            border-radius: 16px;
            border: 1px solid rgba(148, 163, 184, 0.18);
            background: rgba(255,255,255,0.04);
            color: var(--text);
            font-size: 16px;
        }

        input::placeholder { color: rgba(226, 232, 240, 0.65); }

        button {
            width: 100%;
            padding: 16px 18px;
            border-radius: 16px;
            border: none;
            background: var(--accent);
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover { background: #38bdf8; }

        .secondary {
            margin-top: 18px;
            text-align: center;
            color: var(--muted);
        }

        .secondary a {
            color: var(--accent);
            text-decoration: none;
        }

        .flash {
            padding: 14px 18px;
            margin-bottom: 18px;
            border-radius: 16px;
            background: rgba(248, 113, 113, 0.14);
            border: 1px solid rgba(248, 113, 113, 0.18);
            color: #fed7d7;
        }

        .flash.success { background: rgba(34, 197, 94, 0.14); border-color: rgba(34, 197, 94, 0.2); color: #d1fae5; }
    </style>
</head>
<body>
<div class="container">
    <h1>Create Account</h1>
    <p>Register a new account to access the segmentation dashboard.</p>

    {% for message, category in get_flashed_messages(with_categories=true) %}
        <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}

    <form action="/register" method="post">
        <div class="form-group">
            <input type="text" name="username" placeholder="Username" required>
        </div>
        <div class="form-group">
            <input type="password" name="password" placeholder="Password" required>
        </div>
        <div class="form-group">
            <input type="password" name="confirm" placeholder="Confirm Password" required>
        </div>
        <button type="submit">Create Account</button>
    </form>

    <div class="secondary">
        Already have an account? <a href="/login">Sign in</a>
    </div>
</div>
</body>
</html>
